name: Apply redesign
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack redesign into the project
        run: |
          unzip -o redesign-files.zip -d .
          rm redesign-files.zip
          git config user.name "redesign-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Apply UI redesign"
          git push
